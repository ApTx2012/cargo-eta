[package]
name = "cargo-eta"
version = "0.1.0"
edition = "2024"
description = "Cargo subcommand showing real-time build progress with an ETA"
license = "MIT OR Apache-2.0"

[[bin]]
name = "cargo-eta"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
anyhow = "1"

[profile.release]
opt-level = 3